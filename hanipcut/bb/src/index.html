<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>한입컷</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>/*CSS*/</style>
</head>
<body>
<div id="sideFx"></div>
<div id="fullDim"></div>
<div id="stage"><div class="ibg" data-bg="intro_end"></div><img class="sframe" data-a="intro_first" alt=""></div>
<div id="app">
  <canvas id="game"></canvas>
  <div class="hdr" id="hdr">
    <div class="hcoin" id="walletHud" role="status" aria-label="보유 코인"><img class="hcoinIc" data-a="coin_star" alt=""><b id="coinCount">0</b></div>
    <button class="tbtn" id="btnRank">랭킹</button>
    <span class="tbw"><button class="tbtn" id="btnMis">미션</button><i class="cnt" id="hdrDot">0/5</i><span class="mtip" id="missionTip">보상받기</span></span>
    <div class="splank hidden" id="stagePlank" aria-hidden="true"></div>
  </div>

  <div class="layer" id="lobby">
    <img class="logo" data-a="logo" alt="한입컷">
    <div class="lobbyBottom">
      <div class="nick lnick hidden" id="lobbyNick"><input id="nickInput" maxlength="12" placeholder="닉네임 (2~12자)" aria-label="닉네임"><button class="btn s" id="btnNick">저장</button></div>
      <button class="btn green" id="btnStart">게임 시작</button>
      <div class="row">
        <button class="btn blue" id="btnSet2">게임 설정</button>
        <button class="btn red" id="btnMission" style="position:relative">리워드 미션<span class="rchip hidden" id="rewardChip"></span></button>
      </div>
    </div>
  </div>

  <div class="layer hidden" id="play">
    <div class="topRow"><div class="bar" id="bar"><div class="trk"><i id="barFill"></i></div></div><div class="steps" id="steps"></div></div>
    <div class="instr" id="instr"></div>
    <div class="hint" id="hint"></div>
    <div class="areaPreview hidden" id="areaPreview" aria-live="polite"></div>
    <div class="playTools" id="playTools">
      <div class="cutModes" id="cutModes" role="group" aria-label="자르기 방식">
        <button class="btn m cm" id="btnStraight" data-mode="straight" aria-pressed="true">직선 긋기</button>
        <button class="btn m cm off" id="btnCurve" data-mode="curve" aria-pressed="false">곡선 긋기</button>
      </div>
    </div>
    <div class="nav">
      <div class="navg">
        <button class="navb" id="navSet"><span class="rbtn m"><img class="navSetIc" data-a="i_settings" alt=""></span><em>설정</em></button>
        <button class="navb" id="navHome"><span class="rbtn m"><img data-a="i_home" alt=""></span><em>홈</em></button>
      </div>
      <div class="navg" id="boosterBar" role="group" aria-label="아이템">

        <button class="navb item" data-item="stopwatch"><span class="rbtn m"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5C10.22 4.5 8.48 5.028 7 6.017 5.52 7.006 4.366 8.411 3.685 10.056 3.004 11.7 2.826 13.51 3.173 15.256 3.52 17.002 4.377 18.605 5.636 19.864 6.895 21.123 8.498 21.98 10.244 22.327 11.99 22.674 13.8 22.496 15.444 21.815 17.089 21.134 18.494 19.98 19.483 18.5 20.472 17.02 21 15.28 21 13.5 20.997 11.114 20.048 8.826 18.361 7.139 16.674 5.452 14.386 4.503 12 4.5ZM16.281 10.281 12.531 14.031C12.461 14.1 12.378 14.156 12.287 14.193 12.196 14.231 12.099 14.25 12 14.25 11.902 14.25 11.804 14.231 11.713 14.193 11.622 14.156 11.539 14.1 11.469 14.031 11.4 13.961 11.344 13.878 11.307 13.787 11.269 13.696 11.25 13.599 11.25 13.5 11.25 13.402 11.269 13.304 11.307 13.213 11.344 13.122 11.4 13.039 11.469 12.969L15.219 9.219C15.289 9.15 15.372 9.094 15.463 9.057 15.554 9.019 15.652 9 15.75 9 15.849 9 15.946 9.019 16.037 9.057 16.128 9.094 16.211 9.15 16.281 9.219 16.35 9.289 16.406 9.372 16.443 9.463 16.481 9.554 16.5 9.651 16.5 9.75 16.5 9.849 16.481 9.946 16.443 10.037 16.406 10.128 16.35 10.211 16.281 10.281ZM9 2.25C9 2.051 9.079 1.86 9.22 1.72 9.36 1.579 9.551 1.5 9.75 1.5H14.25C14.449 1.5 14.64 1.579 14.78 1.72 14.921 1.86 15 2.051 15 2.25 15 2.449 14.921 2.64 14.78 2.78 14.64 2.921 14.449 3 14.25 3H9.75C9.551 3 9.36 2.921 9.22 2.78 9.079 2.64 9 2.449 9 2.25Z" fill="#4A2C10"/></svg></span><em>스탑워치</em><i class="ibadge" aria-hidden="true">1</i></button>

      </div>
    </div>
  </div>

  <div class="cdim hidden" id="cdim">
    <div class="stageLabel" id="stageLabel"></div>
    <div class="ring" id="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="bg"/><circle cx="60" cy="60" r="52" class="fg" id="ringFg"/></svg><span id="count">3</span></div>
  </div>

  <div class="ready hidden" id="ready">화면을 터치하면 시작!</div>
  <div id="popRoot"></div>
  <canvas id="fx"></canvas>
</div>
<div id="intro">
  <div class="ibg" data-bg="intro_end"></div>
  <video id="introVideo" src="intro.mp4" muted playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
  <img class="iend" data-a="intro_end" alt="">
  <button id="introSkip">건너뛰기</button>
  <div class="itap">화면을 터치해서 시작하세요</div>
</div>
<script>/*ASSETS*/</script>
<script>/*JS*/</script>
</body>
</html>
