<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>텃밭 지키기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>/* 세로 화면 (Figma 'Game UX-UI' Frame 1 기준 360×780).
   위: 쿼터뷰 전장(캔버스) + 떠 있는 헤더·재화, 아래: 둥근 흰 패널(탭 · 수비대 카드 · 하단 메뉴).
   타깃 50~60대: 누르는 곳은 크게, 아이콘엔 글자 라벨 */
:root{
  --wood-text:#6b3410; --wood-sub:rgba(107,52,16,.64); --wood-border:#7a3b10; --wood-deep:#4a2208;
  --card:#fff7ec; --portrait:#eaddca; --paper:#ffffff;
  --plank-a:#faba5a; --plank-b:#d8711e;
  --tab-a:#fac26c; --tab-b:#e98c2a; --tab-bd:#8a4512;
  --gray-a:#cdbba2; --gray-b:#a8957a; --gray-bd:#6e5e48; --gray-tx:#f2eadf;
  --green-a:#8cde5e; --green-b:#3ea52a; --green-bd:#1f6512;
  --blue-a:#78caff; --blue-b:#2e8fe0; --blue-bd:#144f8a;
  --red:#ff3b30; --ink:#3b2410;
  --field-h:min(calc(min(100vw, 480px) * 1.111), 56dvh);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#2b3f17;overflow:hidden;overscroll-behavior:none}
body{font-family:'Jua',system-ui,sans-serif;color:var(--wood-text);font-size:16px;word-break:keep-all;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid #2e8fe0;outline-offset:2px}
#app{position:relative;width:100%;max-width:480px;height:100dvh;margin:0 auto;overflow:hidden;background:#557a2a}

/* ── 전장 ── */
.field{position:absolute;left:0;right:0;top:0;height:var(--field-h)}
#game{display:block;width:100%;height:100%;touch-action:none}

/* 우드 판자 버튼 (Theme Title Plank) */
.plank{position:relative;height:36px;min-width:50px;padding:0 9px;border:2px solid var(--wood-border);border-radius:14px;overflow:hidden;
  background:url(data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNTEiIGhlaWdodD0iMzYiIHZpZXdCb3g9IjAgMCA1MSAzNiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cGF0aCBkPSJNOCAxMC4yODU2QzE3Ljg5MTMgNy43MTQyIDMxLjIwNjUgMTIuODU3MSA0MyA5LjY0Mjc3IiBzdHJva2U9IiNBOTUyMEYiIHN0cm9rZS1vcGFjaXR5PSIwLjMiIHN0cm9rZS13aWR0aD0iMS40Ii8+PHBhdGggZD0iTTYgMjUuNzE0QzE5LjI3NjYgMjguMjg1NCAzMy43OTc5IDIzLjE0MjYgNDUgMjYuMzU2OSIgc3Ryb2tlPSIjQTk1MjBGIiBzdHJva2Utb3BhY2l0eT0iMC4yOCIgc3Ryb2tlLXdpZHRoPSIxLjMiLz48cGF0aCBkPSJNMjAgMTguMDAwMUMyNC4xMjUgMTkuMjg1OCAyNi44NzUgMTYuNzE0NCAzMSAxOC42NDMiIHN0cm9rZT0iI0ZGQ0I3QSIgc3Ryb2tlLW9wYWNpdHk9IjAuMzUiIHN0cm9rZS13aWR0aD0iMS4yIi8+PC9zdmc+Cg==) center/100% 100% no-repeat, linear-gradient(#faba5a,#d8711e);
  box-shadow:0 2px 0 rgba(58,26,5,.24), inset 0 -4px 0 rgba(142,69,18,.4), inset 0 3px 0 rgba(255,224,160,.55);
  font-size:14px;color:var(--wood-text);text-shadow:0 1.5px 0 #ffd48a}
.plank .badge{position:absolute}
/* 원형 우드 버튼 (Theme Round Button) */
.rbtn{width:36px;height:36px;border-radius:18px;border:2px solid var(--wood-border);
  background:linear-gradient(#faba5a,#d8711e);box-shadow:0 2px 0 rgba(58,26,5,.24), inset 0 -3px 0 rgba(142,69,18,.45);
  font-size:18px;color:var(--wood-text);text-shadow:0 1.5px 0 #ffd48a}

.hdr{position:absolute;left:16px;top:calc(env(safe-area-inset-top, 0px) + 10px);display:flex;gap:8px;align-items:center;z-index:5}
/* 재화 카운터 (Theme Counter: 어두운 홈) */
.hud{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top, 0px) + 58px);display:flex;gap:8px;align-items:center;z-index:5}
.counter{position:relative;height:32px;display:flex;align-items:center;gap:6px;padding:0 10px 0 8px;border-radius:19px;background:var(--wood-deep);
  box-shadow:inset 0 2px 3px rgba(0,0,0,.45), 0 1.5px 0 rgba(255,203,122,.5);color:#fff;min-width:0}
.counter b{font-weight:400;font-size:16px;text-shadow:0 1.5px 0 rgba(0,0,0,.5);white-space:nowrap}
.counter .cur{width:24px;height:24px;flex:none}
.counter.gold{padding-right:4px}
.counter .plus{width:24px;height:24px;flex:none;border-radius:12px;border:1.5px solid var(--wood-border);display:grid;place-items:center;
  background:url(data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTgiIGhlaWdodD0iMTgiIHZpZXdCb3g9IjAgMCAxOCAxOCIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48Y2lyY2xlIGN4PSI5IiBjeT0iOSIgcj0iOC41IiBzdHJva2U9IiNCNTYwMUIiIHN0cm9rZS1vcGFjaXR5PSIwLjciLz48L3N2Zz4K) 1.5px 1.5px/18px 18px no-repeat, linear-gradient(#faba5a,#d8711e);box-shadow:inset 0 -2px 0 rgba(142,69,18,.45), 0 1px 0 rgba(58,26,5,.24)}
.counter .plus img{width:14px;height:15px}
.leaf{width:22px;height:22px;flex:none;border-radius:50% 0;background:linear-gradient(135deg,#9be27c,#2f8a2b);transform:rotate(-45deg);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.15)}
.stage{margin-left:auto;height:32px;display:flex;align-items:center;gap:2px;padding:0 12px;border-radius:16px;border:2px solid var(--wood-border);
  background:linear-gradient(#faba5a,#d8711e);box-shadow:0 2px 0 rgba(58,26,5,.24), inset 0 -3px 0 rgba(142,69,18,.4);font-size:14px;text-shadow:0 1.5px 0 #ffd48a;white-space:nowrap}
.stage b{font-weight:400;font-size:17px}
.stage.boss{background:linear-gradient(#ff9a7a,#d4553a);color:#fff;text-shadow:0 1.5px 0 rgba(122,36,18,.5)}
.hud2{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top, 0px) + 98px);display:flex;gap:8px;align-items:flex-start;z-index:5;pointer-events:none}
.chips{flex:1;display:flex;flex-wrap:wrap;gap:6px}
.chip{background:rgba(74,34,8,.85);color:#fff;font-size:14px;padding:5px 9px;border-radius:12px}
.chip.hot{background:rgba(160,48,26,.92)}
.fence{flex:none;display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:12px;background:rgba(74,34,8,.78);color:#fff;font-size:13px}
.ftrack{width:72px;height:10px;border-radius:5px;background:rgba(255,255,255,.25);overflow:hidden}
.ftrack i{display:block;height:100%;width:100%;background:#ffc24a;border-radius:5px;transition:width .25s}
.ftrack i.low{background:#ff6a4a}

/* ── 아래 패널 ── */
.panel{position:absolute;left:0;right:0;bottom:0;top:calc(var(--field-h) - 24px);display:flex;flex-direction:column;background:var(--paper);border-radius:16px 16px 0 0;overflow:hidden;z-index:6;
  padding-bottom:env(safe-area-inset-bottom, 0px)}
/* 탭 (Step Pills = Theme Button S) */
.tabs{flex:none;display:flex;gap:8px;padding:12px 16px}
.tab, .wbtn{position:relative;flex:1;min-width:0;height:36px;display:flex;align-items:center;justify-content:center;padding:0 6px;border-radius:8px;
  border:2px solid var(--gray-bd);background:linear-gradient(var(--gray-a),var(--gray-b));color:var(--gray-tx);font-size:15px;
  text-shadow:0 1.6px 0 rgba(110,94,72,.24);box-shadow:0 2px 0 rgba(58,26,5,.24), inset 0 -3px 0 rgba(110,94,72,.35), inset 0 3px 0 rgba(255,255,255,.4);white-space:nowrap}
.tab span{overflow:hidden;text-overflow:ellipsis}
.tab.on{border-color:var(--tab-bd);background:linear-gradient(var(--tab-a),var(--tab-b));color:var(--wood-text);text-shadow:0 1.2px 0 rgba(255,226,168,.24);
  box-shadow:0 2px 0 rgba(58,26,5,.24), inset 0 -3px 0 rgba(138,69,18,.35), inset 0 3px 0 rgba(255,255,255,.4)}
.tab.garden.ready, .wbtn.green{border-color:var(--green-bd);background:linear-gradient(var(--green-a),var(--green-b));color:#fff;text-shadow:0 1.6px 0 rgba(31,101,18,.24);
  box-shadow:0 2px 0 rgba(58,26,5,.24), inset 0 -3px 0 rgba(31,101,18,.35), inset 0 3px 0 rgba(255,255,255,.4)}
.tab.garden.ready{animation:pulse 1.2s ease-in-out infinite}
.wbtn.blue{border-color:var(--blue-bd);background:linear-gradient(var(--blue-a),var(--blue-b));color:#fff;text-shadow:0 1.6px 0 rgba(20,79,138,.24);
  box-shadow:0 2px 0 rgba(58,26,5,.24), inset 0 -3px 0 rgba(20,79,138,.35), inset 0 3px 0 rgba(255,255,255,.4)}
.wbtn.red{border-color:#8a2a14;background:linear-gradient(#ff9a7a,#d4553a);color:#fff;text-shadow:0 1.6px 0 rgba(122,36,18,.3)}
.wbtn.orange{border-color:var(--tab-bd);background:linear-gradient(var(--tab-a),var(--tab-b));color:var(--wood-text);text-shadow:0 1.2px 0 rgba(255,226,168,.24)}
.wbtn:active, .tab:active{transform:translateY(2px);box-shadow:0 0 0 rgba(58,26,5,.24), inset 0 -2px 0 rgba(0,0,0,.15)}
.wbtn:disabled{cursor:default;transform:none;opacity:.85}
.hidden{display:none!important}

.list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 12px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain}
.bulk{flex:none;display:flex;align-items:center;justify-content:flex-end;gap:6px;font-size:13px;color:var(--wood-sub)}
.bulk button{height:30px;min-width:52px;border-radius:8px;border:2px solid var(--gray-bd);background:linear-gradient(var(--gray-a),var(--gray-b));color:var(--gray-tx);font-size:13px;
  box-shadow:inset 0 -2px 0 rgba(110,94,72,.35)}
.bulk button.on{border-color:var(--tab-bd);background:linear-gradient(var(--tab-a),var(--tab-b));color:var(--wood-text)}

/* 수비대 카드 (Frame 82) */
.card{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px;border-radius:8px;background:var(--card)}
.card .top{display:flex;gap:8px;align-items:center;height:56px}
.card .pt{flex:none;width:56px;height:56px;border-radius:12px;background:var(--portrait);display:grid;place-items:center;overflow:hidden}
.card .pt canvas{width:44px;height:44px}
.card .info{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.card .name{font-size:15px;color:var(--wood-text);line-height:1.2}
.card .lv, .card .role{font-size:12px;color:var(--wood-sub);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .wbtn{flex:none;width:100%;font-size:15px}
.card .wbtn small{font-size:13px;opacity:.95;margin-left:6px}
.card.locked .pt{filter:grayscale(.7);opacity:.6}

/* 하단 메뉴 (Custom Icon Label, Shape=None) */
.bnav{flex:none;height:64px;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #f1e6d6;background:var(--paper)}
.bnav button{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 4px}
.bnav img{width:32px;height:32px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.24))}
.bnav em{font-style:normal;font-size:12px;line-height:16px;color:var(--wood-sub);white-space:nowrap}
.bnav .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:22px;height:16px;padding:0 5px;border-radius:8px;border:1.5px solid #fff;background:#2e8fe0;color:#fff;
  font-size:10px;font-weight:400;display:flex;align-items:center;justify-content:center}
.bnav button.ready img{animation:pulse 1.2s ease-in-out infinite}
.bnav button.ready .badge{background:var(--red)}
.bnav button.ready em{color:var(--wood-text)}
.bnav button.dim{opacity:.55}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@media (prefers-reduced-motion: reduce){.tab.garden.ready,.bnav button.ready img{animation:none}}

/* 미션 배지 (Mission Count Badge) */
.mbadge{position:absolute;right:-6px;top:-6px;height:14px;min-width:24px;padding:0 4px;border-radius:7px;border:1.5px solid #fff;background:var(--red);color:#fff;font-size:9px;
  display:flex;align-items:center;justify-content:center;text-shadow:none}
#btnMission{overflow:visible}

/* ── 토스트 · 팝업 ── */
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top, 0px) + 140px);transform:translate(-50%,20px);width:max-content;max-width:calc(100% - 24px);white-space:normal;text-align:center;opacity:0;pointer-events:none;transition:.25s;
  background:rgba(59,36,16,.92);color:#fff;font-size:17px;padding:12px 20px;border-radius:24px;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
#popRoot .dim{position:absolute;inset:0;background:rgba(30,20,8,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:10px}
.pop{width:100%;max-width:400px;max-height:calc(100dvh - 20px);overflow-y:auto;background:var(--card);border-radius:20px;padding:18px 20px 16px;text-align:center;border:3px solid var(--wood-border)}
.pop h2{font-size:23px;font-weight:400;margin-bottom:6px;color:var(--wood-text)}
.pop p{font-size:18px;line-height:1.5;color:var(--wood-sub)}
.pop .big{font-size:30px;color:#2c7329;margin:8px 0 10px;display:flex;align-items:center;justify-content:center;gap:10px}
.pop .btns{display:flex;gap:10px;margin-top:10px}
.pop .btn{flex:1;min-height:52px;border-radius:10px;border:2px solid var(--green-bd);background:linear-gradient(var(--green-a),var(--green-b));color:#fff;font-size:18px;
  text-shadow:0 1.6px 0 rgba(31,101,18,.3);box-shadow:0 2px 0 rgba(58,26,5,.24), inset 0 -3px 0 rgba(31,101,18,.35), inset 0 3px 0 rgba(255,255,255,.4);padding:4px 8px}
.pop .btn.sub{border-color:var(--gray-bd);background:linear-gradient(var(--gray-a),var(--gray-b));color:var(--gray-tx);text-shadow:0 1.6px 0 rgba(110,94,72,.24)}
.pop .btn.ad{border-color:var(--blue-bd);background:linear-gradient(var(--blue-a),var(--blue-b))}
.pop .btn.ad::before{content:'AD';font-size:12px;background:#fff;color:#2e8fe0;border-radius:6px;padding:1px 6px;margin-right:8px;vertical-align:3px;text-shadow:none}
.pop .btn.krw{border-color:#8a2a14;background:linear-gradient(#ff9a7a,#d4553a)}
.pop ul{text-align:left;font-size:17px;line-height:1.55;color:var(--wood-sub);padding-left:22px;margin:6px 0 4px}
.pop .note{font-size:15px;margin-top:8px}

/* ── 광고 콘텐츠 팝업 안 ── */
.blist,.mlist{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:10px 0 4px;text-align:left}
.brow,.mrow{display:flex;flex-direction:column;align-items:stretch;gap:4px;background:#fff;border:2px solid var(--portrait);border-radius:12px;padding:8px}
.brow .bi{flex:1;display:flex;flex-direction:column;gap:2px}
.brow .bi b{font-weight:400;font-size:19px;color:var(--wood-text)}
.brow .bi small{font-size:14px;color:var(--wood-sub)}
.sbuy,.mrow button{flex:none;width:100%;min-height:50px;border-radius:8px;border:2px solid var(--blue-bd);background:linear-gradient(var(--blue-a),var(--blue-b));color:#fff;font-size:15px;line-height:1.15;
  display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 rgba(20,79,138,.35)}
.sbuy small{font-size:13px}
.sbuy:disabled,.mrow button:disabled{border-color:var(--gray-bd);background:linear-gradient(var(--gray-a),var(--gray-b));box-shadow:none}
.mrow span{font-size:18px;text-align:center;color:var(--wood-text)}
.mrow b{font-weight:400;font-size:23px;color:#2e8fe0;text-align:center}
.mrow.ready button{border-color:var(--green-bd);background:linear-gradient(var(--green-a),var(--green-b))}
.mrow.done{opacity:.7}
.prog{height:16px;border-radius:8px;background:var(--portrait);overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:#2e8fe0;border-radius:8px;transition:width .3s}
.adwall{position:absolute;inset:0;z-index:60;background:#111;display:flex;align-items:center;justify-content:center}
.adbox{color:#fff;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.adbox small{font-size:16px;opacity:.7}
.adbox b{font-size:64px;font-weight:400}
.adbox p{font-size:18px;opacity:.85}
.adclose{margin-top:20px;color:#fff;border:2px solid rgba(255,255,255,.5);border-radius:14px;height:48px;padding:0 22px;font-size:17px}

/* ── 상점 (카드와 같은 모양) ── */
.shop-h{flex:none;display:flex;align-items:baseline;gap:8px;font-size:17px;color:var(--wood-text);padding:6px 2px 0}
.shop-h:first-child{padding-top:0}
.shop-h small{font-size:13px;color:var(--wood-sub)}
.sitem{flex:none;display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;background:var(--card)}
.sitem.pack{box-shadow:inset 0 0 0 2px #f6c46a}
.sitem .ic{flex:none;width:48px;height:48px;border-radius:12px;background:var(--portrait);font-size:28px;display:grid;place-items:center}
.sitem .info{flex:1;min-width:0}
.sitem .name{font-size:15px;color:var(--wood-text)}
.sitem .name i{font-style:normal;font-size:11px;background:var(--red);color:#fff;border-radius:7px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.sitem .desc{font-size:12px;color:var(--wood-sub);margin-top:2px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sitem .wbtn{flex:none;width:auto;min-width:92px;height:44px;font-size:14px;line-height:1.1;flex-direction:column}
.sitem .wbtn small{font-size:11px}
.pay{font-size:16px;color:var(--wood-sub);background:#fff;border:2px dashed var(--portrait);border-radius:12px;padding:10px;margin-top:10px}
.shop-note{flex:none;font-size:13px;color:var(--wood-sub);padding:4px 2px 0;line-height:1.4}
</style>
</head>
<body>
<div id="app">
  <!-- 위: 쿼터뷰 전장 (Figma Game UX-UI · Frame 1) -->
  <main class="field" id="fieldWrap">
    <canvas id="game" aria-label="전장. 오른쪽 위에서 동물이 울타리로 와요. 화면을 누르면 훠이! 하고 쫓아요"></canvas>

    <!-- 헤더: 랭킹 · 미션 (오른쪽은 토스 미니앱 캡슐 자리라 비워 둠) -->
    <header class="hdr">
      <button class="plank" id="btnRank">랭킹</button>
      <button class="plank" id="btnMission">미션</button>
      <button class="rbtn" id="btnHelp" aria-label="도움말">?</button>
    </header>

    <!-- 재화 · 단계 -->

// 마름모 타일 두 가지 색 (Figma Group 22 / Group 21): 윗면 · 왼쪽 옆면 · 오른쪽 옆면
const TILE = [['#689d2b', '#65300c', '#a14b11'], ['#7ab13a', '#7a3b10', '#b45616']];
const bg = document.createElement('canvas'), bgc = bg.getContext('2d');
function drawBoard() {
  bg.width = cv.width; bg.height = cv.height;
  bgc.setTransform(1, 0, 0, 1, 0, 0); bgc.fillStyle = '#557a2a'; bgc.fillRect(0, 0, bg.width, bg.height);
  bgc.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * ox, dpr * oy);
  const top = -oy / scale - 60;
  // 판의 오른쪽 아래 끝(행 15 · 열 15)은 Figma처럼 흙 절벽으로 끝나고, 위·왼쪽으로는 화면이 높을 때를 위해 넉넉히 이어 그림
  for (let sum = -40; sum <= 30; sum++) for (let r = -20; r <= 15; r++) {
    const c = sum - r; if (c < -20 || c > 15) continue;
    const x = 152 + 28 * c - 28 * r, y = -66 + 16 * c + 16 * r;
    if (x < -60 || x > VIEW.W + 4 || y < top || y > VIEW.H + 10) continue;
    const [tp, lf, rt] = TILE[(r + c) & 1];
    bgc.fillStyle = lf; bgc.beginPath(); bgc.moveTo(x, y + 16); bgc.lineTo(x + 28, y + 32); bgc.lineTo(x + 28, y + 52); bgc.lineTo(x, y + 36); bgc.closePath(); bgc.fill();
    bgc.fillStyle = rt; bgc.beginPath(); bgc.moveTo(x + 28, y + 32); bgc.lineTo(x + 56, y + 16); bgc.lineTo(x + 56, y + 36); bgc.lineTo(x + 28, y + 52); bgc.closePath(); bgc.fill();
    bgc.fillStyle = tp; bgc.beginPath(); bgc.moveTo(x + 28, y); bgc.lineTo(x, y + 16); bgc.lineTo(x + 28, y + 32); bgc.lineTo(x + 56, y + 16); bgc.closePath(); bgc.fill();
  }
  bgDirty = false;
}
// 울타리 말뚝 9개 (Figma tewwstwsffeaa 1~8 자리, 32×32) — 무너진 만큼 흐리게 주저앉음
function drawFence(hpRatio) {
  const im = UI_IMG.fence; if (!im) return;
  for (let k = 0; k < 9; k++) {
    const broken = hpRatio < 1 && ((k * 7) % 9) / 9 >= hpRatio;
    g.globalAlpha = broken ? 0.35 : 1;
    g.drawImage(im, -6 + 28 * k, 248 + 16 * k + (broken ? 6 : 0), 32, 32);
  }
  g.globalAlpha = 1;
}
// 텃밭 밭고랑 13칸 (Figma Group 24, 50×28) — 다 익으면 살짝 들썩이며 반짝
const PLOTS = [];
for (let i = 0; i < 7; i++) PLOTS.push([-41 + 28 * i, 272 + 16 * i]);
for (let i = 0; i < 6; i++) PLOTS.push([-41 + 28 * i, 304 + 16 * i]);
function drawPlots() {
  const im = UI_IMG.plot; if (!im) return;
  PLOTS.forEach(([x, y], i) => {
    const bob = gardenRipe ? -Math.abs(Math.sin(animClock * 3 + i * 0.7)) * 2 : 0;
    g.drawImage(im, x, y + bob, 50, 28);
    if (gardenRipe && (i % 3 === 0)) { g.fillStyle = `rgba(255,248,170,${0.45 + 0.35 * Math.sin(animClock * 4 + i)})`; dot(g, x + 27, y + 6 + bob, 2.2); }
  });
}

// ── 스프라이트 (1줄 시트) ──
// 파일 하나 = 동작 하나 = 가로 1줄. 세로 길이를 한 칸으로 보고 가로를 정사각형 칸으로 자동으로 나눔 (칸 수 자유).
//   수비대: sprites/def_<id>_idle.png (서 있기, 반복) · sprites/def_<id>_attack.png (공격, 한 번) — 오른쪽(동물 쪽)을 보게
//   동물:   sprites/an_<id>_walk.png (걷기, 반복) · sprites/an_<id>_flee.png (도망, 반복) — 왼쪽(텃밭 쪽)을 보게, 도망칠 때 뒤집기는 코드
//   동작 이름 없는 def_<id>.png / an_<id>.png 는 서 있기 / 걷기로 씀. 발끝은 칸 아래 가운데. 파일이 없으면 임시 그림.
// 미리보기 도구 '텃밭 지키기 스프라이트 보기'와 같은 규칙.
const MOTION_FPS = { idle: 6, attack: 14, walk: 8, flee: 12 };
const sheets = {};   // 'def_grandma_idle' → { img, n, cell, fps }
// opt: { n: 칸 수 직접, fps: 속도 직접, manual: 미리보기 도구·끌어다 놓기로 넣은 것 (sprites/ 파일보다 우선) }
function setSheet(key, img, opt = {}) {
  if (sheets[key] && sheets[key].manual && !opt.manual) return;
  if (opt.fallback && sheets[key] && !sheets[key].fallback) return;   // 기본 그림은 스프라이트가 없을 때만
  const motion = key.split('_').pop();
  const n = opt.n > 0 ? Math.floor(opt.n) : Math.max(1, Math.floor(img.width / img.height));
  const cell = opt.n > 0 ? Math.floor(img.width / n) : img.height;

function loadSheet(key, files) {   // files: 앞에 있는 이름부터 시도

for (const d of DEFENDERS) { loadSheet(`def_${d.id}_idle`, [`def_${d.id}_idle.png`, `def_${d.id}.png`]); loadSheet(`def_${d.id}_attack`, [`def_${d.id}_attack.png`]); }

// 던지는 것(동물에게 날아가는 것): sprites/shot.png 하나를 모두가 씀. 수비대마다 다르게 하려면 sprites/shot_<수비대 id>.png

// 시트의 f번째 칸을 (x, 발끝 y) 기준으로 높이 H에 맞춰 그림

}

// ── 그리기: 수비대 ──
let animClock = 0;
// 공격 동작 시작 시각 (스프라이트 공격 시트는 14fps로 끝까지 한 번 재생)

function drawDefender(c, d, x, y, s, atk = 0, alpha = 1) {

  c.fillStyle = 'rgba(40,60,20,.25)'; c.beginPath(); c.ellipse(x, y + 2, 26 * s, 7 * s, 0, 0, 6.283); c.fill();

  const attacking = attack && at < attack.n / attack.fps;

  else if (idle) {

  } else if (attack) drawSheetFrame(c, attack, 0, x, y - H + 6 * s, H);

    c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(d.emoji, 0, 0);

}

// ── 그리기: 동물 (옆모습, 왼쪽 텃밭을 보고 걸어옴) ──
const ANIMAL_DRAW = 0.95;   // 코드로 그린 동물 크기 (디자인 px, 판정 크기와 별개)
const ANIMAL_SPRITE_H = 2.3;   // 동물 스프라이트 그리는 높이 = 판정 반지름 × 2.3 × 깊이 배율 (멧돼지 대장은 반지름이 커서 약 2배)
function drawAnimal(a) {
  const run = a.fleeing > 0, alpha = run ? Math.max(0, 1 - a.fleeing / 0.9) : 1;
  const P0 = P(a.x, a.y);
  a = Object.assign(Object.create(a), { x: P0.x, y: P0.y });   // 아래 그리기는 화면 좌표로
  const k = ANIMAL_DRAW * dsc(a.y), r = a.r;
  const walk = sheets[`an_${a.kind}_walk`], flee = sheets[`an_${a.kind}_flee`];
  const img = run ? flee || walk : walk || flee;
  const hop = img ? 0 : a.kind === 'rabbit' ? -Math.abs(Math.sin(a.phase)) * 8 : a.kind === 'sparrow' ? -Math.abs(Math.sin(a.phase * 0.5)) * 5 : Math.sin(a.phase) * 1.2;
  const jx = a.hitT > 0 ? Math.sin(a.hitT * 90) * 2.5 : 0;
  // 그림자
  g.fillStyle = 'rgba(40,60,20,.25)'; g.beginPath(); g.ellipse(a.x, a.y + r * 0.55 * k, r * 0.9 * k, r * 0.22 * k, 0, 0, 6.283); g.fill();
  g.save(); g.globalAlpha = alpha; g.translate(a.x + jx, a.y + hop); g.scale(run ? -k : k, k);   // 도망칠 땐 숲 쪽(오른쪽)을 봄
  if (img) {
    const H = r * ANIMAL_SPRITE_H;

  } else if (a.kind === 'sparrow') {
    const fl = Math.sin(a.phase) * 0.6;
    g.strokeStyle = '#c47a2c'; g.lineWidth = 2; line(g, -2, r * 0.55, -4, r * 0.9); line(g, 4, r * 0.55, 2, r * 0.9);
    g.fillStyle = '#6b4424'; g.beginPath(); g.moveTo(r * 0.7, -2); g.lineTo(r * 1.5, -8); g.lineTo(r * 1.4, 4); g.closePath(); g.fill();   // 꼬리
    g.fillStyle = '#a8763f'; g.beginPath(); g.ellipse(0, 0, r, r * 0.75, 0, 0, 6.283); g.fill();
    g.fillStyle = '#f0dcb8'; g.beginPath(); g.ellipse(-2, r * 0.25, r * 0.65, r * 0.4, 0, 0, 6.283); g.fill();
    g.fillStyle = '#7a4f28'; g.save(); g.translate(2, -2); g.rotate(-0.3 - fl); g.beginPath(); g.ellipse(4, 0, r * 0.7, r * 0.35, 0, 0, 6.283); g.fill(); g.restore();   // 날개
    g.fillStyle = '#5a3a1a'; circle(-r * 0.8, -r * 0.45, r * 0.5);                 // 머리
    g.fillStyle = '#f0a43a'; g.beginPath(); g.moveTo(-r * 1.25, -r * 0.5); g.lineTo(-r * 1.65, -r * 0.35); g.lineTo(-r * 1.25, -r * 0.25); g.closePath(); g.fill();
    g.fillStyle = '#fff'; dot(g, -r * 0.95, -r * 0.55, 3); g.fillStyle = '#1e1208'; dot(g, -r * 0.98, -r * 0.55, 1.8);
  } else if (a.kind === 'rabbit') {
    g.fillStyle = '#efe8dc'; g.strokeStyle = '#b8ab95'; g.lineWidth = 1.5;
    g.beginPath(); g.ellipse(r * 0.9, -2, 6, 6, 0, 0, 6.283); g.fill(); g.stroke();      // 꼬리
    g.beginPath(); g.ellipse(0, 0, r, r * 0.75, 0, 0, 6.283); g.fill(); g.stroke();     // 몸
    g.beginPath(); g.ellipse(r * 0.45, r * 0.55, 9, 5, 0, 0, 6.283); g.fill(); g.stroke();   // 뒷발

      g.fillStyle = '#efe8dc'; g.beginPath(); g.ellipse(0, -11, 5, 14, 0, 0, 6.283); g.fill(); g.stroke();
      g.fillStyle = '#f4b9b0'; g.beginPath(); g.ellipse(0, -10, 2.4, 9, 0, 0, 6.283); g.fill(); g.restore();
    }

    g.fillStyle = '#1e1208'; dot(g, -r * 0.9, -r * 0.55, 2.6);

    g.fillStyle = '#6b4226'; g.strokeStyle = '#3e2412'; g.lineWidth = 2;
    g.beginPath(); g.ellipse(r * 0.15, 0, r * 1.05, r * 0.7, 0, 0, 6.283); g.fill(); g.stroke();   // 몸
    g.fillStyle = '#4d2e18'; for (let i = 0; i < 6; i++) { g.beginPath(); g.moveTo(-r * 0.3 + i * r * 0.22, -r * 0.62); g.lineTo(-r * 0.2 + i * r * 0.22, -r * 0.9); g.lineTo(-r * 0.1 + i * r * 0.22, -r * 0.62); g.fill(); }   // 갈기

}

// ── 그리기: 선물 상자를 문 까치 (하늘을 가로질러 감) ──
const gift = { active: false, t: 0, dir: 1, nextIn: 0 };
function scheduleGift() { const [a, b] = AD.GIFT_EVERY_SEC; gift.nextIn = FAST ? 15 : a + Math.random() * (b - a); }
scheduleGift();
function giftPos() {
  const k = gift.t / AD.GIFT_FLY_SEC, span = VIEW.W + 100;
  return { x: gift.dir > 0 ? -50 + span * k : VIEW.W + 50 - span * k, y: 182 + Math.sin(gift.t * 3) * 8 };
}
function drawGift() {
  if (!gift.active) return;
  const { x, y } = giftPos(), fl = Math.sin(gift.t * 16) * 0.6;
  g.save(); g.translate(x, y); g.scale(0.85, 0.85);
  g.fillStyle = '#d4553a'; g.strokeStyle = '#7a2412'; g.lineWidth = 2;             // 상자
  roundRect(-14, 14, 28, 24, 4); g.fill(); g.stroke();
  g.fillStyle = '#ffe14d'; g.fillRect(-3, 14, 6, 24); g.fillRect(-14, 23, 28, 6);
  g.strokeStyle = '#3b2410'; g.lineWidth = 1.5; line(g, 0, 4, 0, 14);
  g.scale(gift.dir, 1);
  g.fillStyle = '#26324a';
  for (const sx of [-1, 1]) { g.save(); g.rotate(sx * fl); g.beginPath(); g.ellipse(sx * 16, -4, 16, 6, sx * -0.3, 0, 6.283); g.fill(); g.restore(); }

  g.fillStyle = '#f4f4f4'; g.beginPath(); g.ellipse(-2, 3, 8, 5, 0, 0, 6.283); g.fill();
  g.fillStyle = '#26324a'; circle(12, -6, 8);
  g.fillStyle = '#f0a43a'; g.beginPath(); g.moveTo(18, -7); g.lineTo(27, -4); g.lineTo(18, -2); g.closePath(); g.fill();
  g.fillStyle = '#fff'; dot(g, 14, -8, 2.2);
  g.restore();
  const pulse = 1 + Math.sin(gift.t * 6) * 0.08;
  outlinedText('선물!', x, y - 22, 16 * pulse, '#ffe14d');
}

// ── 그리기 도우미 ──
function circle(x, y, r) { g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill(); }
function dot(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, 6.283); c.fill(); }
function line(c, x1, y1, x2, y2) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }
function roundRectC(c, x, y, w, h, r) { c.beginPath(); if (c.roundRect) c.roundRect(x, y, Math.max(0, w), h, r); else c.rect(x, y, Math.max(0, w), h); }

function outlinedText(text, x, y, size, color, stroke = '#3b2410') {
  g.font = `${size}px Jua, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineJoin = 'round'; g.lineWidth = Math.max(3, size / 5); g.strokeStyle = stroke; g.strokeText(text, x, y);
  g.fillStyle = color; g.fillText(text, x, y);
}

// ── 한 프레임 ──
function render(dt) {
  if (bgDirty) drawBoard();
  const sh = fx.shake > 0 ? (Math.random() - 0.5) * fx.shake * 10 : 0;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(bg, Math.round(sh * dpr), 0);
  g.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (ox + sh), dpr * oy);
  // 수비대 + 동물을 화면 깊이(y) 순서로 함께 그림
  const items = [];
  for (const d of DEFENDERS) {
    const lv = S.levels[d.id] || 0;
    if (S.maxStage < d.unlock) continue;
    const p = P(d.x, d.y);
    items.push({ y: p.y, draw: () => {
      drawDefender(g, d, p.x, p.y, DEF_H * dsc(p.y) / 92, fx.atk[d.id] || 0, lv > 0 ? 1 : 0.4);
      if (lv <= 0) {   // 아직 고용 전: 흐린 모습 + 작은 + 표시 (아래 목록에서 고용)
        g.fillStyle = '#3ea52a'; g.strokeStyle = '#fff'; g.lineWidth = 1.5;
        g.beginPath(); g.arc(p.x + 12, p.y - 40, 7.5, 0, 6.283); g.fill(); g.stroke();
        outlinedText('+', p.x + 12, p.y - 40, 13, '#fff', 'rgba(0,0,0,0)');
      }
    } });
  }
  for (const a of B.animals) items.push({ y: P(a.x, a.y).y, draw: () => drawAnimal(a) });
  items.sort((p, q) => p.y - q.y).forEach(it => it.draw());
  // 던지는 것 (sprites/shot.png, 없으면 노란 공) — 땅 위로 손 높이만큼 띄워서
  for (const s of B.shots) {
    const p = P(s.x, s.y), lift = 18, sh2 = sheets['shot_' + s.by] || sheets.shot;
    if (sh2) { g.save(); g.translate(p.x, p.y - lift); g.rotate(s.x * 0.06); drawSheetFrame(g, sh2, sheetFrame(sh2, animClock, true), 0, -SHOT_SIZE / 2, SHOT_SIZE); g.restore(); }
    else { g.fillStyle = '#f2c94c'; g.strokeStyle = '#a57618'; g.lineWidth = 1.2; g.beginPath(); g.arc(p.x, p.y - lift, 4.5, 0, 6.283); g.fill(); g.stroke(); }
  }
  drawFence(Math.max(0, B.fenceHp) / core.F.FENCE_MAX);
  drawPlots();
  drawGift();
  // 훠이·범위 원 (바닥에 납작한 타원)
  for (const r of fx.rings) {
    const k = r.t / r.life, rx = (10 + k * (r.r || core.F.SHOO_RADIUS) * PX);
    g.strokeStyle = `rgba(${r.color || '255,255,255'},${1 - k})`; g.lineWidth = 3;
    g.beginPath(); g.ellipse(r.x, r.y, rx, rx * 0.57, 0, 0, 6.283); g.stroke();
  }
  // 떠오르는 글자
  for (const f of fx.floats) {
    const k = f.t / f.life;
    g.globalAlpha = k < 0.75 ? 1 : 1 - (k - 0.75) / 0.25;
    const y = f.y - f.rise * Math.min(1, k * 1.6);
    if (f.leaf) {
      g.save(); g.translate(f.x - f.size * 0.9, y); g.rotate(-0.78);
      g.fillStyle = '#4fae45'; g.strokeStyle = '#2c7329'; g.lineWidth = 1.5;
      g.beginPath(); g.ellipse(0, 0, f.size * 0.32, f.size * 0.2, 0, 0, 6.283); g.fill(); g.stroke(); g.restore();
      outlinedText(f.text, f.x + 6, y, f.size, f.color);
    } else outlinedText(f.text, f.x, y, f.size, f.color);
    g.globalAlpha = 1;
  }
  // 스테이지 안내
  if (fx.banner) {
    const b = fx.banner, k = b.t / b.life, a = k < 0.15 ? k / 0.15 : k > 0.8 ? (1 - k) / 0.2 : 1;
    g.globalAlpha = Math.max(0, a);
    const cx = VIEW.W / 2, y = 222, bw = 300;
    g.fillStyle = b.boss ? 'rgba(160,48,26,.92)' : 'rgba(74,34,8,.85)';
    roundRect(cx - bw / 2, y - 32, bw, b.sub ? 70 : 52, 16); g.fill();
    outlinedText(b.text, cx, y - (b.sub ? 8 : 0) - 6, b.boss ? 22 : 24, b.boss ? '#ffe14d' : '#fff', 'rgba(0,0,0,0)');
    if (b.sub) outlinedText(b.sub, cx, y + 20, 15, '#fff3d6', 'rgba(0,0,0,0)');
    g.globalAlpha = 1;
  }
}

// ── 전투 이벤트 → 연출·재화 ──
const SHOUT = { jindo: '멍!', cat: '하악!', goose: '꽥!', grandpa: '깨갱깽!', rooster: '꼬끼오!', goat: '메에~', chief: '물러가라~', cow: '음매~' };
let nextStartAt = 0;
function handleEvents() {
  for (const e of B.drain()) {
    switch (e.type) {
      case 'stage':
        if (e.boss) banner('멧돼지 대장이 내려와요!', '울타리를 지켜 주세요', true);

function pointerDesign(ev) { const r = cv.getBoundingClientRect(); return toDesign(ev.clientX - r.left, ev.clientY - r.top); }
function pointerPos(ev) { const d = pointerDesign(ev); return unP(d.x, d.y + 14); }   // 손가락은 보통 몸통을 누르므로 발 쪽으로 조금 내려서

  const p = pointerPos(ev), dp = pointerDesign(ev);
  if (gift.active) { const q = giftPos(); if (Math.hypot(dp.x - q.x, dp.y - (q.y + 8)) < 40) { gift.active = false; scheduleGift(); openGift(); return; } }

  popup(`<h2>까치가 선물을 두고 갔어요!</h2><p>광고를 보고 열면 채소 ${AD.GIFT_VALUE_MIN}분치가 들어 있어요</p><div class="big">🎁 +${core.korNum(v)}</div><p class="note">오늘 남은 상자 ${left}/${AD.GIFT_DAILY}</p>`,
    [{ label: '광고 보고 열기', ad: true, onClick: () => watchAd(() => { if (!core.useDaily(S, 'gift', wall())) return; S.crops += v; toast(`채소 ${core.korNum(v)}을 받았어요`); }) },
     { label: '괜찮아요', sub: true }]);
}

// ── 오늘의 복주머니 ──
function openPouch() {
  const left = core.dailyLeft(S, 'pouch', wall());
  popup(`<h2>오늘의 복주머니</h2><p>광고를 보고 열면 채소, 황금 씨앗,<br>토스 포인트(예시) 중 하나가 나와요</p><div class="big">🧧</div><p class="note">오늘 남은 횟수 ${left}/${AD.POUCH_DAILY}</p>`,
    left > 0 ? [{ label: '광고 보고 열기', ad: true, onClick: () => watchAd(() => {
        if (!core.useDaily(S, 'pouch', wall())) return;
        const prize = core.rollPouch(S, Math.random(), Math.random()); core.applyPouch(S, prize); showPrize(prize);
      }) }, { label: '닫기', sub: true }]
      : [{ label: '내일 또 만나요', sub: true }]);
}
function showPrize(p) {
  const txt = p.type === 'crops' ? `<i class="leaf"></i>+${core.korNum(p.amount)}` : p.type === 'seed' ? `🌰 황금 씨앗 ${p.amount}개` : `토스 포인트 ${p.amount}P`;
  const sub = p.type === 'crops' ? `채소 ${p.minutes}분치가 나왔어요` : p.type === 'seed' ? '모든 수비대 힘과 채소가 영원히 2% 늘어요' : '포인트는 예시예요 (실제 지급은 출시 때 연결)';
  popup(`<h2>복주머니에서 나왔어요!</h2><div class="big">${txt}</div><p>${sub}</p>`, [{ label: '좋아요' }]);
}

// ── 광고 누적 보상 (오늘 본 광고 수) ──
function openAdReward() {
  const total = AD.MILESTONES[AD.MILESTONES.length - 1][0];
  popup(`<h2 class="adTitle"></h2><div class="prog"><i></i></div><div class="mlist"></div><p class="note"></p>`,
    [{ label: '닫기', sub: true }], root => {
      const paint = () => {
        const d = core.ensureDaily(S, wall());
        root.querySelector('.adTitle').textContent = `오늘 본 광고 ${d.ads}번`;
        root.querySelector('.prog i').style.width = Math.min(100, d.ads / total * 100) + '%';
        root.querySelector('.mlist').innerHTML = AD.MILESTONES.map(([n, pt], i) => {
          const st = d.claimed[i] ? 'done' : d.ads >= n ? 'ready' : 'wait';
          const label = st === 'done' ? '받았어요' : st === 'ready' ? '받기' : `${n - d.ads}번 더`;
          return `<div class="mrow ${st}"><span>광고 ${n}번</span><b>${pt}P</b><button data-ms="${i}" ${st === 'ready' ? '' : 'disabled'}>${label}</button></div>`;
        }).join('');
        root.querySelector('.note').innerHTML = `모은 토스 포인트 ${S.points}P (예시)<br>새참·텃밭·선물·복주머니 광고가 모두 세져요. 매일 자정에 새로 시작해요`;
        root.querySelectorAll('[data-ms]').forEach(b => b.addEventListener('click', () => {
          const got = core.claimMilestone(S, +b.dataset.ms, wall());
          if (got) { toast(`토스 포인트 ${got}P를 받았어요 (예시)`); save(); refreshAdUi(); paint(); }
        }));
      };
      paint();
    });
}

// ── 보스 재도전 응원 ──
function offerCheer(bossStage) {
  nextStartAt = 0;
  popup(`<h2>멧돼지 대장이 너무 세요!</h2><p>광고를 보면 물러나지 않고 바로 다시 도전해요.<br>${AD.CHEER_SEC}초 동안 수비대 힘이 ${AD.CHEER_MULT}배!</p>`,
    [{ label: '광고 보고 바로 재도전', ad: true, onClick: () => {
        watchAd(() => { S.stage = bossStage; cheerLeft = AD.CHEER_SEC; syncBoost(); refreshHud(); toast(`응원 받고 힘 ${AD.CHEER_MULT}배! 다시 가요`); })
          .then(ok => { if (!ok) toast('한 단계 뒤에서 힘을 길러요'); nextStartAt = now() + 500; });
      } },
     { label: '한 단계 뒤에서 힘 기르기', sub: true, onClick: () => { nextStartAt = now() + 600; } }]);
}

// ── 자동 훠이 버프 ──
let autoT = 0;
function autoShoo(dt) {
  if (B.state !== 'running' || core.buffLeft(S, 'auto', wall()) <= 0) return;
  autoT += dt; if (autoT < 1 / AD.BUFFS.auto.rate) return; autoT = 0;
  let front = null;
  for (const a of B.animals) if (!a.fleeing && !a.gone && a.x < FIELD.W && (!front || a.x < front.x)) front = a;   // 울타리에 가장 가까운 동물
  if (front) B.shoo(front.x, front.y, true);
}

$('btnSnack').addEventListener('click', openSnack);
$('btnPouch').addEventListener('click', openPouch);
$('btnAdReward').addEventListener('click', openAdReward);
$('btnGarden').addEventListener('click', onGarden);
$('btnGarden2').addEventListener('click', onGarden);
$('tabTools').addEventListener('click', () => toast('농기구는 준비 중이에요'));
$('btnRank').addEventListener('click', () => toast('랭킹은 준비 중이에요'));
$('btnMission').addEventListener('click', () => toast('미션은 준비 중이에요'));

// ── 상점 · 결제 (예시) — 실제 결제는 앱인토스 인앱결제 SDK로 교체. ?payfail=1 → 결제 실패 ──
const SHOP = core.SHOP;
let curTab = 'def';
function openTab(tab) {
  curTab = tab;
  document.querySelectorAll('.tab[data-tab]').forEach(b => { const on = b.dataset.tab === tab; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  $('defList').classList.toggle('hidden', tab !== 'def'); $('bulkRow').classList.toggle('hidden', tab !== 'def');
  $('shopList').classList.toggle('hidden', tab !== 'shop');
  if (tab === 'shop') refreshShop(true);
}
document.querySelectorAll('.tab[data-tab]').forEach(b => b.addEventListener('click', () => openTab(b.dataset.tab)));
$('goldPill').addEventListener('click', () => openTab('shop'));

const SHOP_SECTIONS = [['daily', '오늘의 혜택', '매일 자정 새로'], ['gold', '금화로 사기', ''], ['pack', '패키지', '결제 (예시)'], ['gold_pack', '금화 충전', '결제 (예시)']];
let shopSig = '';
const WBTN = { '': 'green', ad: 'blue', gold: 'orange', krw: 'red', off: '' };
function priceLabel(it, st) {
  if (st.why === 'owned') return { cls: 'off', html: '구매 완료' };
  if (st.why === 'daily') return { cls: 'off', html: '내일 또<small>받을 수 있어요</small>' };
  if (st.why === 'member') return { cls: 'off', html: '회원권<small>전용</small>' };
  if (st.why === 'ripe') return { cls: 'off', html: '이미<small>익었어요</small>' };
  const d = core.ensureDaily(S, wall()), used = d.shop[it.id] || 0;
  switch (it.price.type) {
    case 'free': return { cls: '', html: '무료 받기' };
    case 'ad': return { cls: 'ad', html: `광고 보고<small>받기 ${used}/${it.daily}</small>` };
    case 'gold': return { cls: 'gold' + (st.why === 'gold' ? ' off' : ''), html: `🪙 ${it.price.amount}` };
    case 'krw': return { cls: 'krw', html: core.won(it.price.amount) };
  }
}
function refreshShop(force) {
  if (curTab !== 'shop' && !force) return;
  const t = wall(), member = core.isMember(S, t);
  const states = SHOP.ITEMS.map(it => [it, core.shopState(S, it.id, t)]);
  const sig = states.map(([it, st]) => it.id + st.ok + st.why).join() + member + core.memberDaysLeft(S, t) + S.gold + (core.ensureDaily(S, t).shop.ad_gold || 0);
  if (!force && sig === shopSig) return;
  shopSig = sig;
  let html = '';
  for (const [sec, title, sub] of SHOP_SECTIONS) {
    const items = states.filter(([it]) => it.sec === sec && !(it.member && !member));
    if (!items.length) continue;
    html += `<div class="shop-h">${title}${sub ? `<small>${sub}</small>` : ''}</div>`;
    for (const [it, st] of items) {
      const p = priceLabel(it, st);
      let desc = it.desc;
      if (it.id === 'p_member' && member) desc = `사용 중 · ${core.memberDaysLeft(S, t)}일 남음 (더 사면 30일 연장)`;
      html += `<div class="sitem${it.sec === 'pack' ? ' pack' : ''}"><div class="ic" aria-hidden="true">${it.icon}</div>
        <div class="info"><div class="name">${it.name}${it.tag ? `<i>${it.tag}</i>` : ''}</div>${desc ? `<div class="desc">${desc}</div>` : ''}</div>
        <button class="wbtn ${p.cls === 'off' ? '' : WBTN[p.cls.split(' ')[0]] || ''}" data-shop="${it.id}" ${p.cls === 'off' ? 'disabled' : ''}>${p.html}</button></div>`;
    }
  }
  html += `<p class="note shop-note">결제 상품은 예시예요. 출시 때 토스 인앱결제로 연결해요.<br>확률로 나오는 유료 상품은 없어요.</p>`;
  $('shopList').innerHTML = html;
}
$('shopList').addEventListener('click', ev => {
  const b = ev.target.closest('[data-shop]'); if (!b) return;
  onShop(b.dataset.shop);
});
function giftText(got) {
  const parts = [];
  if (got.gold) parts.push(`🪙 금화 ${core.korNum(got.gold)}`);
  if (got.seeds) parts.push(`🌰 황금 씨앗 ${got.seeds}개`);
  if (got.crops) parts.push(`🥬 채소 ${core.korNum(got.crops)}`);
  if (got.buffMin) parts.push(`🍱 새참 3종 ${got.buffMin}분`);
  if (got.garden) parts.push('🌱 텃밭이 바로 익었어요');
  if (got.memberDays) parts.push(`🎫 농장 회원권 ${got.memberDays}일`);
  if (got.cropx2) parts.push('🧺 채소 2배가 영원히 적용돼요');
  if (got.adfree) parts.push('✨ 이제 광고 없이 바로 보상을 받아요');
  return parts.join('<br>');
}
function afterBuy(got, big) {
  cropsDirty = true; syncBoost(); save(); refreshShop(true); refreshAdUi(); refreshList(true);
  if (big) popup(`<h2>고맙습니다!</h2><p class="got">${giftText(got)}</p>`, [{ label: '좋아요' }]);
  else toast(giftText(got).replace(/<br>/g, ' · '));
}
function onShop(id) {
  const it = core.SHOP_BY_ID[id], t = wall(), st = core.shopState(S, id, t);
  if (!st.ok) {
    if (st.why === 'gold') { toast(`금화가 ${it.price.amount - S.gold}개 모자라요. 아래 '금화 충전'이나 광고로 모을 수 있어요`); }
    return;
  }
  if (it.price.type === 'free' || it.price.type === 'gold') { const got = core.buyShop(S, id, t); if (got) afterBuy(got, false); return; }
  if (it.price.type === 'ad') { watchAd(() => { const got = core.buyShop(S, id, wall()); if (got) toast(giftText(got)); }).then(() => refreshShop(true)); return; }
  // 현금 상품: 결제 확인 → (예시) 결제
  popup(`<h2>${it.icon} ${it.name}</h2><p>${it.desc}</p><div class="big">${core.won(it.price.amount)}</div>
    <p class="pay">결제 예시 화면이에요. 실제로는 토스 결제창이 뜨고, 지금은 돈이 나가지 않아요.</p>`,
    [{ label: `${core.won(it.price.amount)} 결제하기`, krw: true, onClick: () => fakePay(it) }, { label: '다음에 할게요', sub: true }]);
}
function fakePay(it) {
  adOpen = true;   // 결제 중 전투 멈춤
  const el = document.createElement('div'); el.className = 'adwall';
  el.innerHTML = `<div class="adbox"><small>결제 (예시)</small><b class="adsec">⏳</b><p>${it.name} · ${core.won(it.price.amount)}</p></div>`;
  $('app').append(el);
  setTimeout(() => {
    el.remove(); adOpen = false; last = now();
    if (DEV.has('payfail')) { toast('결제가 완료되지 않았어요. 돈은 나가지 않았어요'); return; }
    const got = core.buyShop(S, it.id, wall());
    if (got) afterBuy(got, true);
  }, 1200);
}

// ── 메인 루프 ──
let last = now(), saveT = 0, listT = 0;
function frame() {
  const t = now(); let dt = Math.min(0.05, (t - last) / 1000); last = t;
  if (popOpen || adOpen) { dt = 0; hold = null; }
  if (listThumbsDirty && typeof rows !== 'undefined') { listThumbsDirty = false; for (const id in rows) rows[id].drawnLv = null; refreshList(true); }
  if (dt > 0) {
    if (cheerLeft > 0) cheerLeft = Math.max(0, cheerLeft - dt);
    syncBoost();
    B.step(dt);
    autoShoo(dt);
    updateGift(dt);
    if (hold) { hold.t += dt; if (hold.t >= HOLD_REPEAT) { hold.t = 0; B.shoo(hold.p.x, hold.p.y); } }
    handleEvents();
    if (B.state !== 'running' && nextStartAt && t >= nextStartAt) { nextStartAt = 0; B.start(S.stage); refreshFence(); }
    for (const f of fx.floats) f.t += dt; fx.floats = fx.floats.filter(f => f.t < f.life);
    for (const r of fx.rings) r.t += dt; fx.rings = fx.rings.filter(r => r.t < r.life);
    if (fx.banner) { fx.banner.t += dt; if (fx.banner.t >= fx.banner.life) fx.banner = null; }
    if (fx.shake > 0) fx.shake = Math.max(0, fx.shake - dt);
    animClock += dt;
    for (const k in fx.atk) fx.atk[k] = Math.max(0, fx.atk[k] - dt * 3.5);
    saveT += dt; if (saveT >= CFG.autosaveSec) { saveT = 0; save(); }
  }
  if (cropsDirty) refreshCrops();
  listT += 1 / 60; if (listT > 0.2) { listT = 0; refreshList(false); refreshAdUi(); refreshShop(false); }
  render(dt);
  requestAnimationFrame(frame);
}

// ── 저장 시점: 화면이 가려질 때 바로 ──
document.addEventListener('visibilitychange', () => {
  if (document.hidden) save();
  else { checkAway(); last = now(); }
});
window.addEventListener('pagehide', save);

// ── 시작 ──
function boot() {
  resize(); buildList(); setBulk(S.bulk); refreshHud(); refreshCrops(); refreshAdUi(); refreshShop(true);
  if (firstVisit) {
    popup(`<h2>동물들이 텃밭을 노려요!</h2><p>수비대와 함께 텃밭을 지켜 주세요.<br>쫓아낸 동물은 채소를 남기고 가요.</p>`,
      [{ label: '지키러 가기' }]);
  } else checkAway();
  B.start(S.stage);
  save();
  requestAnimationFrame(frame);
  if (window.parent !== window) window.parent.postMessage({ type: 'farm-ready', version: CFG.version }, '*');   // 개발용: 미리보기 도구에 준비됐다고 알림
}
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(boot, boot);
// 개발용: 스프라이트 PNG를 게임 화면에 끌어다 놓으면 바로 적용 (파일 이름 규칙은 위 '스프라이트' 참고, 새로 고치면 sprites/ 폴더 것으로 돌아감)
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault();
  const done = [];
  for (const f of e.dataTransfer?.files || []) {
    const ms = /^shot(?:_([a-z0-9]+))?\.png$/i.exec(f.name);
    if (ms) { const key = ms[1] ? 'shot_' + ms[1].toLowerCase() : 'shot'; const im = new Image(); im.onload = () => setSheet(key, im, { manual: true }); im.src = URL.createObjectURL(f); done.push(f.name); continue; }
    const m = /^(def|an)_([a-z0-9]+?)(?:_(idle|attack|walk|flee))?\.png$/i.exec(f.name);
    const kind = m && m[1].toLowerCase(), id = m && m[2].toLowerCase();
    const motion = m && (m[3] ? m[3].toLowerCase() : kind === 'def' ? 'idle' : 'walk');
    if (!m || (kind === 'def' ? !DEF_BY_ID[id] || !['idle', 'attack'].includes(motion) : !ANIMALS[id] || !['walk', 'flee'].includes(motion))) { toast(`${f.name}: 이름 규칙과 달라요 (예: def_grandma_idle.png)`); continue; }
    const img = new Image();
    img.onload = () => { setSheet(`${kind}_${id}_${motion}`, img, { manual: true }); };
    img.src = URL.createObjectURL(f); done.push(f.name);
  }
  if (done.length) toast(`스프라이트 ${done.length}장 적용했어요`);
});
// 개발용: 미리보기 도구 '텃밭 지키기 스프라이트 보기'가 이 게임을 품고(iframe) 스프라이트·명령을 보냄
const SHEET_KEY = /^(def_[a-z0-9]+_(idle|attack)|an_[a-z0-9]+_(walk|flee)|shot(_[a-z0-9]+)?)$/;
addEventListener('message', e => {
  if (window.parent === window || e.source !== window.parent) return;
  const m = e.data || {};
  if (m.type === 'farm-sprite' && SHEET_KEY.test(m.key) && m.blob instanceof Blob) {
    const img = new Image();
    img.onload = () => setSheet(m.key, img, { n: m.n, fps: m.fps, manual: true });
    img.src = URL.createObjectURL(m.blob);
  } else if (m.type === 'farm-sprite-clear' && SHEET_KEY.test(m.key)) { delete sheets[m.key]; listThumbsDirty = true; }
  else if (m.type === 'farm-cmd') {
    if (m.cmd === 'reset') { resetting = true; try { localStorage.removeItem(CFG.saveKey); } catch (err) {} window.parent.postMessage({ type: 'farm-reset-done' }, '*'); }   // 도구가 게임을 새로 띄움
    else if (m.cmd === 'stage') {
      const st = Math.max(1, Math.min(999, Math.floor(+m.value) || 1));
      S.stage = st; S.maxStage = Math.max(S.maxStage, st);
      for (const d of DEFENDERS) if (S.maxStage >= d.unlock && !(S.levels[d.id] > 0)) S.levels[d.id] = 1;   // 만난 수비대는 모두 1레벨로 세워 둠
      nextStartAt = 0; B.start(S.stage); listThumbsDirty = true; refreshHud(); refreshFence(); save();
    }
  }
});
window.__farm = { S, B, core, CFG, gift, openTab };   // 개발용 (콘솔 확인)
</script>
